name: Build rhwp

# Builds the HWP → PDF converter the app ships (rhwp, MIT, https://github.com/edwardkim/rhwp) from the
# crates.io source and publishes it as a prerelease, so the (25 minute) build is not repeated for every
# app release. Run it by hand when the rhwp version changes:
#
#   1. Actions → "Build rhwp" → Run workflow (rhwp version, build number).
#   2. Copy the three SHA-256 lines from the run's summary into third_party/rhwp/rhwp.lock
#      (and RHWP_VERSION / RHWP_BUILD), commit. The Release workflow downloads that exact build
#      with tool/fetch_rhwp.sh and refuses anything whose hash differs.
#
# Minimal build: no PDF import and no Skia (the app only uses `export-pdf`), which is ~46 MB instead of
# the official 77 MB. Fonts are neither built in nor downloaded — the app runs it offline (see CLAUDE.md).
#
# The release is a PRERELEASE with a non-semver tag (rhwp-v<version>-b<build>) so it is never mistaken for
# an app release by anything that looks for "the latest release" or for `v*.*.*` tags.
on:
  workflow_dispatch:
    inputs:
      rhwp_version:
        description: "rhwp crate version on crates.io"
        required: true
        default: "0.9.1"
      build:
        description: "Build number (a new number per rebuild of the same version)"
        required: true
        default: "1"

permissions:
  contents: read

env:
  RHWP_VERSION: ${{ inputs.rhwp_version }}
  RHWP_BUILD: ${{ inputs.build }}
  # Same size setting as the tested local build.
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, exe: rhwp.exe, run: true }
          # An older Ubuntu keeps the glibc requirement low for the users' distributions.
          - { platform: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, exe: rhwp, run: true }
          - { platform: macos-arm64, os: macos-26, target: aarch64-apple-darwin, exe: rhwp, run: true }
          # Cross-compiled on the arm64 runner; merged with the arm64 build into one universal binary below.
          - { platform: macos-x64, os: macos-26, target: x86_64-apple-darwin, exe: rhwp, run: false }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      EXE: ${{ matrix.exe }}
    steps:
      - name: Check inputs
        shell: bash
        run: |
          [[ "$RHWP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::rhwp_version must look like 0.9.1"; exit 1; }
          [[ "$RHWP_BUILD" =~ ^[0-9]+$ ]] || { echo "::error::build must be a number"; exit 1; }

      # rhwp 0.9.x needs Rust 1.93.1 or newer (its rust-version).
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
          rustc --version

      # --locked uses the Cargo.lock shipped in the crate, so the dependency versions are the ones rhwp tested.
      - name: Build rhwp
        shell: bash
        run: |
          cargo install rhwp --version "$RHWP_VERSION" --locked \
            --no-default-features --features wasm-api --bin rhwp \
            --target "$TARGET" --root "$RUNNER_TEMP/rhwp-root" --target-dir "$RUNNER_TEMP/rhwp-target"
          mkdir -p out
          cp "$RUNNER_TEMP/rhwp-root/bin/$EXE" "out/$EXE"
          # The licenses ship in the crate. Relative paths only: GNU tar on the Windows runner reads "D:\..." as a remote host.
          mkdir -p crate-src
          (cd crate-src \
            && curl -fsSL "https://static.crates.io/crates/rhwp/rhwp-${RHWP_VERSION}.crate" -o rhwp.crate \
            && tar -xzf rhwp.crate)
          cp "crate-src/rhwp-${RHWP_VERSION}/LICENSE" "crate-src/rhwp-${RHWP_VERSION}/THIRD_PARTY_LICENSES.md" out/
          ls -l out

      # Cheap check that the binary starts and reads HWP; the cross-built macOS x64 one cannot run here.
      - name: Smoke test
        if: matrix.run
        shell: bash
        run: |
          "out/$EXE" --version
          "out/$EXE" capabilities | grep -q '"hwp5"'

      - uses: actions/upload-artifact@v4
        with:
          name: rhwp-${{ matrix.platform }}
          path: out
          if-no-files-found: error

  package:
    needs: build
    # macOS: `lipo` builds the universal binary.
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: parts

      - name: Make the macOS binary universal
        run: |
          mkdir -p parts/rhwp-macos-universal
          lipo -create parts/rhwp-macos-arm64/rhwp parts/rhwp-macos-x64/rhwp -output parts/rhwp-macos-universal/rhwp
          cp parts/rhwp-macos-arm64/LICENSE parts/rhwp-macos-arm64/THIRD_PARTY_LICENSES.md parts/rhwp-macos-universal/
          lipo -info parts/rhwp-macos-universal/rhwp
          # lipo drops the linker's signature, and an unsigned binary is killed on Apple silicon.
          # (The app's own signing step re-signs it with the Developer ID.)
          codesign --force --sign - parts/rhwp-macos-universal/rhwp
          codesign --verify --verbose parts/rhwp-macos-universal/rhwp
          chmod +x parts/rhwp-macos-universal/rhwp
          parts/rhwp-macos-universal/rhwp --version

      - name: Package
        run: |
          mkdir -p dist
          {
            tool/package_rhwp.sh windows-x64 parts/rhwp-windows-x64/rhwp.exe parts/rhwp-windows-x64 dist "$RHWP_VERSION" "$RHWP_BUILD"
            tool/package_rhwp.sh linux-x64 parts/rhwp-linux-x64/rhwp parts/rhwp-linux-x64 dist "$RHWP_VERSION" "$RHWP_BUILD"
            tool/package_rhwp.sh macos-universal parts/rhwp-macos-universal/rhwp parts/rhwp-macos-universal dist "$RHWP_VERSION" "$RHWP_BUILD"
          } | tee dist/SHA256SUMS.txt
          ls -l dist

      - name: Summary (paste into third_party/rhwp/rhwp.lock)
        run: |
          {
            echo "### rhwp $RHWP_VERSION build $RHWP_BUILD"
            echo
            echo 'Paste into `third_party/rhwp/rhwp.lock`:'
            echo
            echo '```'
            echo "RHWP_VERSION=$RHWP_VERSION"
            echo "RHWP_BUILD=$RHWP_BUILD"
            echo "RHWP_SHA256_WINDOWS_X64=$(grep 'windows-x64' dist/SHA256SUMS.txt | cut -d' ' -f1)"
            echo "RHWP_SHA256_MACOS_UNIVERSAL=$(grep 'macos-universal' dist/SHA256SUMS.txt | cut -d' ' -f1)"
            echo "RHWP_SHA256_LINUX_X64=$(grep 'linux-x64' dist/SHA256SUMS.txt | cut -d' ' -f1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Fails if the tag already exists: a published build is never overwritten (bump the build number instead).
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "rhwp-v${RHWP_VERSION}-b${RHWP_BUILD}" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "rhwp ${RHWP_VERSION} (build ${RHWP_BUILD}) — converter binaries, not an app release" \
            --notes "HWP to PDF converter binaries built from the crates.io source of rhwp ${RHWP_VERSION} (MIT) by the Build rhwp workflow. Used by the app's release workflow; not an app release. Minimal build (no PDF import, no Skia). Verify with SHA256SUMS.txt or third_party/rhwp/rhwp.lock."
